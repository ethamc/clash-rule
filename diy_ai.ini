;设置规则标志位

;设置分组标志位
custom_proxy_group=🚀 默认代理`select`[]🚀 手动选择`[]香港-自动`[]台湾-自动`[]新加坡-自动`[]日本-自动`[]美国-自动`[]韩国-自动`[]DIRECT
