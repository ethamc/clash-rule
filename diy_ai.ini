[custom]

;设置规则标志位
; --- 1. AI服务（优先级最高，包含OpenAI/Gemini/Claude/Perplexity/Grok等所有主流AI） ---
ruleset=🤖 AI服务,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.list
ruleset=🤖 AI服务,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list
ruleset=🤖 AI服务,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Anthropic/Anthropic.list
ruleset=🤖 AI服务,https://ghfast.top/https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_AI.list
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn

; --- 2. 你的原有流媒体、网盘与常用服务 ---
ruleset=💾 PikPak,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/PikPak/PikPak.list
ruleset=🎥 Netflix,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list
ruleset=🎞️ Disney+,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Disney/Disney.list
ruleset=📺️ Youtube,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🌏️ Google,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=Ⓜ️ 微软服务,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
ruleset=🕹️ Steam,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.list
ruleset=🍎 Apple,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list

; --- 3. 直连与兜底规则（已补全中国大陆全量域名与IP直连） ---
ruleset=🎯 全球直连,https://ghfast.top/https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Custom_Direct.list,28800
ruleset=🎯 全球直连,https://ghfast.top/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list,28800
ruleset=🎯 全球直连,https://ghfast.top/https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Steam_CDN.list,28800
ruleset=🎯 全球直连,https://ghfast.top/https://raw.githubusercontent.com/Aethersailor/Custom_OpenClash_Rules/main/rule/Game_Download_CDN.list,28800
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🚀 默认代理,[]FINAL
;设置规则标志位

;设置分组标志位（已精简掉所有多余地区分组，全部纯手动选择）
custom_proxy_group=🚀 默认代理`select`[]🚀 手动选择`[]DIRECT
custom_proxy_group=🚀 手动选择`select`.*
custom_proxy_group=🤖 AI服务`select`^(?!.*(香港|Hong Kong|HK|俄罗斯|Russia|RU|中国|China|CN|剩余|过期|流量|官网)).*
custom_proxy_group=💾 PikPak`select`[]🚀 默认代理`.*
custom_proxy_group=🎥 Netflix`select`[]🚀 默认代理`.*
custom_proxy_group=🎞️ Disney+`select`[]🚀 默认代理`.*
custom_proxy_group=📺️ Youtube`select`[]🚀 默认代理`.*
custom_proxy_group=🌏️ Google`select`[]🚀 默认代理`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 默认代理`[]DIRECT`.*
custom_proxy_group=🕹️ Steam`select`[]DIRECT`[]🚀 默认代理`.*
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]🚀 默认代理`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 默认代理
;设置分组标志位

enable_rule_generator=true
overwrite_original_rules=true
